 W.pl=W.pl.filter(p=>p.c!=-2&&p.c!=-3);
 for(const p of W.pl.filter(p=>p.c>=0&&p.c!=W.me&&p.ag<=27&&p.ov>=70))if(ch(.15)){const from=W.cl[p.c];p.oc=pk(EUROS);log(`海外移籍：${p.n}（${p.po}）${from.n}→${p.oc} ${fm(val(p)*1.2)}`);p.c=-4;p.w=wage(p)}
 for(let i=0;i<8;i++){const ag=RI(18,21),pt=RI(84,95),ov=C(pt-RI(10,18),66,80),p=gp(randPos(),ag,ov,pt,-4,gname(pk(['en','de','fr','it','es','pt'])));p.oc=pk(EUROS);p.w=wage(p);W.pl.push(p)}
 for(const p of W.pl)if(p.c==-4&&p.yr<=0)p.yr=RI(2,4);
 // AI contracts & academy & balance
 for(const c of W.cl){for(const p of sq(c.id))if(c.id!=W.me&&p.yr<=0)p.yr=RI(2,4);if(c.id==W.me)continue;for(let k=RI(1,2);k>0;k--){const ov=C(Math.round(c.r-30+R(0,10)),32,56);W.pl.push(gp(randPos(),17,ov,ov+RI(8,28),c.id,gname(LG[c.lg].g)))}}
 W._m=null;for(const c of W.cl){const s=sq(c.id);for(const po in NEED){const n=s.filter(p=>p.po==po).length,mn=Math.max(2,NEED[po]-1);for(let k=n;k<mn;k++){const ag=RI(19,32),ov=C(Math.round(c.r-13+R(-5,4)),42,82);const p=gp(po,ag,ov,ov,c.id,gname(LG[c.lg].g));p.w=wage(p);W.pl.push(p)}}if(c.id!=W.me){const s2=sq(c.id).sort((a,b)=>b.ov-a.ov);for(const p of s2.slice(28))p.c=-1}}
 W._m=null;
 // pool signed by AI
 for(const p of W.pool.sort((a,b)=>b.pt-a.pt).slice(0,10)){const c=pk(W.cl.filter(c=>c.r>=64&&c.lg=='J1'&&c.id!=W.me));if(c&&ch(.7)){p.c=c.id;p.w=wage(p);W.pl.push(p);if(p.pt>=90)log(`神童：${p.n}（${p.ag}歳 潜在${p.pt}）が${c.n}入り`)}}
 W.pool=[];for(const p of W.pl)if(p.c>=0&&p.c!=W.me)p.w=wage(p);W._m=null;
 W.y++;W.md=0;W.xo={};W.exp=sq(W.me).filter(p=>p.yr<=0).map(p=>p.id);for(const lg in W.lgc)mkSched(lg);genPool();W.sc=[];
 W.sum=msg;if(W.conf<15)W.fired=true;return msg}
function save(){try{localStorage.setItem('fm26',JSON.stringify(W))}catch(e){}}

function modal(h){const m=$('#md');m.innerHTML=h?`<div class="mb">${h}<button class="s" onclick="modal()">閉じる</button></div>`:'';m.style.display=h?'flex':'none'}

function fix(){const me=W.cl[W.me],r=W.sched[me.lg][W.md];if(!r)return null;const m=r.find(([h,a])=>h==W.me||a==W.me);return m}
function adv(n){if(W.fired)return;const me=W.cl[W.me];for(const id of W.exp){const p=W.pl.find(x=>x.id==id);if(p&&p.yr<=0){p.c=-1;log(`${p.n}が契約満了で退団`)}}W.exp=[];W._m=null;
 const tot=W.sched[me.lg].length;for(let i=0;i<n&&W.md<tot;i++)advRound();save();render();if(n==1&&W.last)showMatch()}
function showMatch(){const m=W.last;if(!m)return;const H=W.cl[m.h],A=W.cl[m.a],evs=m.ev.map(e=>`<div class="ev ${e.side?'r':''}">${e.m}' ⚽ ${esc(e.s)}${e.a?` <small>(${esc(e.a)})</small>`:''}</div>`).join('')||'<div class="ev">ゴールなし</div>';
 const all=[...m.rh,...m.ra].sort((a,b)=>b.r-a.r)[0],mine=m.h==W.me?m.rh:m.ra;
 modal(`<h3>第${m.md}節</h3><div class="sc"><div>${emb(H.e,40)}<br>${esc(H.n)}</div><b>${m.gh} - ${m.ga}</b><div>${emb(A.e,40)}<br>${esc(A.n)}</div></div>${evs}<div class="st">ポゼッション ${m.poss}% - ${100-m.poss}%　シュート ${m.sh[0]} - ${m.sh[1]}</div><div class="st">MOM：${esc(all.n)}（${all.r}）</div><div class="st">自チーム採点：${mine.map(x=>esc(x.n)+' '+x.r).join(' ／ ')}</div>`)}
function setup(){
 const has=(()=>{try{return !!localStorage.getItem('fm26')}catch(e){return false}})();
 $('#app').innerHTML=`<h1>ROAD TO GLORY<small>Jリーグ クラブ監督シミュレーター 2026</small></h1>${has?'<div class="c"><button id="ct" class="main">前回の続きから<small>オートセーブを読み込む</small></button></div>':''}<div class="c"><h2>監督名</h2><input id="mn" value="${esc(W&&W.mn||'')}" maxlength="14" placeholder="あなたの名前"></div><div class="c"><h2>就任するクラブを選ぼう</h2><div class="tb">${Object.keys(LG).map(k=>`<button class="tg ${k==UI.lg?'on':''}" onclick="UI.lg='${k}';setup()">${LG[k].fl} ${LG[k].n}</button>`).join('')}</div>${W.cl.filter(c=>c.lg==UI.lg).sort((a,b)=>b.r-a.r).map(c=>{const st=sq(c.id).filter(p=>p.rl).sort((a,b)=>b.ov-a.ov).slice(0,3).map(p=>p.n).join('・');return `<div class="cr" onclick="pick(${c.id})">${emb(c.e,40)}<div><b>${esc(c.n)}</b><small>${st||'若手中心のチーム'}</small></div><span class="rt">${c.r}</span></div>`}).join('')}</div><div class="c" style="font-size:12px;color:var(--mu)">※クラブ名・選手名は権利への配慮から、一目で分かる程度にあえて変更しています。クラブ構成・選手データは2025年までの情報をもとにした概算です。実際の2026年の所属・能力とは異なる場合があります。名前が架空の選手は「架空」と表示されます。J1〜J3は昇降格あり。海外の大物（欧州の実在選手）は「移籍」の獲得リストに「海外クラブ」で出ます。</div>`;
 const b=$('#ct');if(b)b.onclick=()=>{load();render()}}
function pick(id){const c=W.cl[id];modal(`<div style="text-align:center">${emb(c.e,90)}<h3>${esc(c.n)}</h3><p>チーム総合 ${c.r}／年間収入 約${fm(c.rev)}</p><p style="font-size:13px;color:var(--mu)">就任後、クラブタブでエンブレムとクラブ名を自由に変更できます。</p><button class="main" onclick="start(${id})">監督に就任する</button></div>`)}
function start(id){W.mn=($('#mn')&&$('#mn').value.trim())||'監督';W.me=id;const c=W.cl[id];W.cash=c.rev*.35;W.conf=60;W.log=[];log(`${W.mn}監督が${c.n}の指揮官に就任`);modal();save();UI.tab='home';render()}
const TABS=[['home','🏠','ホーム'],['squad','👥','選手'],['tac','📋','戦術'],['tr','🔁','移籍'],['tbl','📊','順位'],['club','🛡️','クラブ']];
function render(){
 if(!W||W.me<0)return setup();const me=W.cl[W.me],T=UI.tab;

 $('#app').innerHTML=top+`<div id="pg">${pg(T)}</div><nav>${TABS.map(([k,i,n])=>`<button class="${k==T?'on':''}" onclick="UI.tab='${k}';render()"><span>${i}</span>${n}</button>`).join('')}</nav>`}
function pg(T){return T=='home'?home():T=='squad'?squadP():T=='tac'?tac():T=='tr'?trP():T=='tbl'?tblP():clubP()}
function home(){const me=W.cl[W.me],f=fix(),tot=W.sched[me.lg].length,fin=W.md>=tot,T=tbl(me.lg),rk=T.indexOf(me)+1;let h='';
 if(W.exp.length)h+=`<div class="c"><h2>契約更新（${W.exp.length}人）</h2>${W.exp.map(id=>{const p=W.pl.find(x=>x.id==id);if(!p||p.c!=W.me)return '';const w=Math.round(p.w*(1.1+(p.ov>=80?.15:0))*10)/10;return `<div class="pr">${pb(p)}<span class="pn">${esc(p.n)}</span><span class="ag">${p.ag}</span><b class="ov">${p.ov}</b><button class="sm" onclick="renewP(${p.id},${w})">3年 ${fm(w)}</button><button class="sm s" onclick="relP(${p.id})">退団</button></div>`}).join('')}<div style="font-size:11px;color:var(--mu)">開幕までに更新しない選手は退団します。</div></div>`;
 if(fin)h+=`<div class="c"><h2>シーズン終了</h2><div class="msg">${rk}位でフィニッシュ</div><button class="main" onclick="doEnd()">シーズン総括・オフシーズンへ<small>選手の成長・引退・新星の入団が行われます</small></button></div>`;
 else{const o=f?W.cl[f[0]==W.me?f[1]:f[0]]:null;h+=`<div class="c"><h2>次の試合</h2>${o?`<div class="sc"><div>${emb(me.e,40)}</div><b style="font-size:15px">${f[0]==W.me?'HOME':'AWAY'}　vs</b><div>${emb(o.e,40)}</div></div><div class="st">${esc(o.n)}（総合${o.r}・現在${T.indexOf(o)+1}位）　戦力差 ${(ovr(W.me)-ovr(o.id)).toFixed(1)}</div>`:'試合なし'}<button class="main" onclick="adv(1)">試合を行う<small>第${W.md+1}節 / 全${tot}節</small></button><div class="two"><button class="s" onclick="adv(5)">5節進める</button><button class="s" onclick="adv(99)">最後まで</button></div></div>`}
 h+=`<div class="c"><h2>状況</h2><div class="st">順位 ${rk}位 / 勝点${me.t.p}（${me.t.w}勝${me.t.d}分${me.t.l}敗）　目標：${Math.max(1,Math.ceil(W.cl.filter(c=>c.lg==me.lg&&c.r>me.r).length*.85+1))}位以内</div>${W.last?`<button class="s" onclick="showMatch()">前節 ${W.last.gh}-${W.last.ga}（${esc(W.cl[W.last.h].n)} vs ${esc(W.cl[W.last.a].n)}）</button>`:''}</div><div class="c"><h2>ニュース</h2>${W.log.slice(0,12).map(x=>`<div class="ev">${esc(x)}</div>`).join('')}</div>`;return h}
function renewP(id,w){const p=W.pl.find(x=>x.id==id);p.w=w;p.yr=3;W.exp=W.exp.filter(x=>x!=id);log(`${p.n}と3年契約を更新`);save();render()}

 const cs=W.cl.filter(c=>c.id!=W.me&&c.r>=p.ov-12).sort(()=>Math.random()-.5).slice(0,RI(0,2)),eu=p.ov>=62&&p.ag<=31?[...Array(RI(1,2))].map(()=>pk(EUROS)):[];

 else if(S=='sell')h+=`<div class="c">${sq(W.me).sort((a,b)=>b.ov-a.ov).map(p=>row(p,`sellM(${p.id})`,`<span class="ag">${fm(val(p))}</span>`)).join('')}</div>`;
 else if(S=='fa'){const l=W.pl.filter(p=>p.c==-1).sort((a,b)=>b.ov-a.ov).slice(0,25);h+=`<div class="c">${l.map(p=>row(p,`nego(${p.id})`,`<span class="ag">${fm(wage(p))}</span>`)).join('')||'フリー選手はいません'}</div>`}
 else h+=`<div class="c"><h2>スカウト網 Lv${W.sk}/5</h2><div class="st">レベルが高いほど多くの候補が見つかり、潜在能力の見積もり精度も上がります。</div>${W.sk<5?`<button class="s" onclick="upSk()">スカウト網を強化（${fm(.6*W.sk)}）</button>`:''}<div class="tb" style="margin-top:8px">${Object.keys(REG).map(k=>`<button class="tg" onclick="scoutR('${k}')">${k}を調査（${fm(.15)}）</button>`).join('')}</div></div><div class="c"><h2>調査結果</h2>${W.sc.map(id=>W.pool.find(x=>x.id==id)).filter(Boolean).map(p=>`<div class="pr" onclick="nego(${p.id})">${pb(p)}<span class="pn">${esc(p.n)}${p.pe>=90?' 🌟':''}<em>${p.rg}</em></span><span class="ag">${p.ag}歳</span><b class="ov">${p.ov}</b><span class="ag">潜${p.pe}</span></div>`).join('')||'地域を選んで調査しよう。神童が見つかるかも。'}</div>`;return h}
function upSk(){const c=.6*W.sk;if(W.cash<c)return modal('<p>予算不足</p>');W.cash-=c;W.sk++;save();render()}
function scoutR(rg){if(W.cash<.15)return modal('<p>予算不足</p>');W.cash-=.15;const l=W.pool.filter(p=>p.rg==rg).sort(()=>Math.random()-.5).slice(0,2+W.sk);for(const p of l)p.pe=p.pt+RI(-(6-W.sk),6-W.sk);W.sc=l.map(p=>p.id);const g=l.filter(p=>p.pe>=88).length;log(`${rg}を調査：${l.length}人の候補${g?`（神童の可能性${g}人！）`:''}`);save();render()}
const fp=id=>W.pl.find(x=>x.id==id)||W.pool.find(x=>x.id==id);
function nego(id){const p=fp(id);if(!p)return;const youth=p.c==-3&&p.ag<=20,fa=p.c==-1,fee=youth?Math.round((.3+Math.pow(Math.max(0,(p.pe||p.pt)-70),2)*.018)*10)/10:fa?0:Math.round(val(p)*(p.c==-4?1.3:1.15)*10)/10;
 if(!youth&&!fa&&!win())return modal('<p>移籍市場が閉じています。冬の市場（シーズン中盤）か夏のプレシーズンを待とう。</p>');
 modal(`<h3>${esc(p.n)}</h3><div class="st">${p.po}／${p.ag}歳／総合${p.ov}／潜在${p.pe!=null?p.pe:p.pt}${p.c>=0?'／所属 '+esc(W.cl[p.c].n):p.oc?'／所属 '+esc(p.oc)+'（海外）':''}</div><div class="st">基準移籍金 ${fm(fee)}／希望年俸 ${fm(youth?.3:wage(p)*1.2)}</div>${fee>0?`<label>移籍金のオファー<select id="nf"><option value="1">標準（${fm(fee)}）</option><option value="1.3">上乗せ（${fm(fee*1.3)}）</option><option value="1.7">破格（${fm(fee*1.7)}）</option></select></label>`:''}<label>年俸のオファー<select id="nw"><option value="1">標準</option><option value="1.4">高給 ×1.4</option><option value="1.8">破格 ×1.8</option></select></label><button class="main" onclick="doBuy(${p.id},${fee})">オファーする</button>`)}
function doBuy(id,fee){const p=fp(id),m=$('#nf')?+$('#nf').value:1,wm=+$('#nw').value,f=fee*m,me=W.cl[W.me],youth=p.c==-3&&p.ag<=20,their=p.c>=0?W.cl[p.c].r:p.c==-4?85:70,eu=p.c==-4;
 if(W.cash-f<-me.rev*.3)return modal('<p>予算が足りません（借入限度を超えます）。</p>');
 const sp=(p.c>=0||eu)?C(.4+(m-1)*.6-(p.ov>=85?.2:0)-(their>=88?.1:0)+(eu&&p.ag>=33?.25:0),.05,.95):1,pa=eu?C(.12+(wm-1)*.5+(p.ag>=33?.3:0)+(p.jp?.25:0)+(me.lg=='J1'?.04:0),.03,.92):C(.55+(me.r-their)/35+(wm-1)*.45,.05,.95);const nw=sq(W.me).reduce((a,q)=>a+q.w,0)+wage(p)*1.2*wm;if(nw>me.rev*.85)return modal('<p>年俸総額がクラブの収入を大きく超えてしまうため、獲得できません。</p>');
 const ok1=ch(sp),ok2=ch(youth?C(.5+(me.r-72)/30,.1,.95):pa);
 if(!ok1)return modal(`<p>${p.c>=0?esc(W.cl[p.c].n):p.oc?esc(p.oc):'相手'}は提示額に応じませんでした。</p>`);if(!ok2)return modal(`<p>${esc(p.n)}は移籍に乗り気ではありませんでした（クラブの格や年俸が決め手）。</p>`);
 W.cash-=f;p.c=W.me;p.w=youth?.3:Math.round(wage(p)*1.2*wm*10)/10;p.yr=youth?4:RI(3,5);delete p.rg;W.pool=W.pool.filter(x=>x.id!=p.id);if(!W.pl.includes(p))W.pl.push(p);W.sc=W.sc.filter(x=>x!=p.id);W._m=null;if(p.pt>=90&&p.ag<=20)W.tro.push(W.y+' 神童獲得：'+p.n);
 log(`${p.n}（${p.ag}歳 ${p.po}）を${fm(f)}で獲得！`);save();modal(`<h3>🎉 契約成立！</h3><p>${esc(p.n)}が加入しました。</p>`);render()}
function tblP(){const lg=UI.lg=W.cl[W.me].lg==UI.lg||UI.tl?UI.lg:UI.lg,T=tbl(lg),me=W.cl[W.me];const sc=W.pl.filter(p=>p.c>=0&&W.cl[p.c].lg==lg).sort((a,b)=>b.g-a.g).slice(0,10);
 return `<div class="tb">${Object.keys(LG).map(k=>`<button class="tg ${k==lg?'on':''}" onclick="UI.lg='${k}';render()">${k}</button>`).join('')}</div><div class="c"><h2>${LG[lg].n}</h2><table><tr><th>#</th><th></th><th>試</th><th>勝</th><th>分</th><th>敗</th><th>得失</th><th>点</th></tr>${T.map((c,i)=>`<tr class="${c.id==W.me?'me':''}"><td>${i+1}</td><td class="tl">${esc(c.n)}</td><td>${c.t.w+c.t.d+c.t.l}</td><td>${c.t.w}</td><td>${c.t.d}</td><td>${c.t.l}</td><td>${c.t.gf-c.t.ga}</td><td><b>${c.t.p}</b></td></tr>`).join('')}</table></div><div class="c"><h2>得点ランキング</h2>${sc.map((p,i)=>`<div class="pr"><span class="ag">${i+1}</span><span class="pn">${esc(p.n)}<em>${esc(W.cl[p.c].cd)}</em></span><b class="ov">${p.g}</b></div>`).join('')}</div>`}
function clubP(){const me=W.cl[W.me],e=me.e,wb=sq(W.me).reduce((a,p)=>a+p.w,0);return `<div class="c" style="text-align:center"><div id="ep">${emb(e,110)}</div></div><div class="c"><h2>エンブレム＆クラブ名</h2><label>クラブ名<input value="${esc(me.n)}" maxlength="20" oninput="W.cl[W.me].n=this.value||'無名FC'"></label><label>略称（3文字）<input value="${esc(e.tx)}" maxlength="3" oninput="W.cl[W.me].e.tx=this.value.toUpperCase();ep()"></label><div class="two"><select onchange="W.cl[W.me].e.sh=this.value;ep()">${[['shield','盾型'],['round','円形'],['sq','角丸'],['hex','六角']].map(([k,n])=>`<option value="${k}" ${e.sh==k?'selected':''}>${n}</option>`).join('')}</select><select onchange="W.cl[W.me].e.pt=this.value;ep()">${[['p','無地'],['v','縦割り'],['s','ストライプ'],['h','横割り'],['d','斜め'],['b','横帯']].map(([k,n])=>`<option value="${k}" ${e.pt==k?'selected':''}>${n}</option>`).join('')}</select></div><div class="two"><label>メインカラー<input type="color" value="#${e.c1}" oninput="W.cl[W.me].e.c1=this.value.slice(1);ep()"></label><label>サブカラー<input type="color" value="#${e.c2}" oninput="W.cl[W.me].e.c2=this.value.slice(1);ep()"></label></div><div class="ics">${ICS.map(i=>`<button class="ic" onclick="W.cl[W.me].e.ic='${i}';ep()">${i}</button>`).join('')}</div></div><div class="c"><h2>財政</h2><div class="st">年間収入 約${fm(me.rev)}／年俸総額 ${fm(wb)}／資金 ${fm(W.cash)}</div><div class="st">スカウト網 Lv${W.sk}／経営陣の信頼度 ${Math.round(W.conf)}</div></div><div class="c"><h2>実績</h2>${W.tro.map(t=>`<div class="ev">🏆 ${esc(t)}</div>`).join('')||'<div class="ev">まだタイトルはありません</div>'}${W.hist.map(h=>`<div class="ev">${h.y}：${esc(h.club)} ${h.rk}位（勝点${h.p}）</div>`).join('')}</div><div class="c"><button class="s" onclick="save();modal('<p>セーブしました</p>')">セーブ</button><button class="s" onclick="if(confirm('最初からやり直しますか？')){init();render()}">最初からやり直す</button></div>`}
function ep(){$('#ep').innerHTML=emb(W.cl[W.me].e,110);save()}

if(!load()){init()}render();</script></body></html>
